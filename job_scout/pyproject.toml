[project]
name = "job_scout"
version = "0.1.0"
description = "job_scout using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.15.22",
    "firecrawl-py>=4.45.0",
    "exa-py>=1.0.0",
]

[project.scripts]
job_scout = "job_scout.main:run"
run_crew = "job_scout.main:run"
train = "job_scout.main:train"
replay = "job_scout.main:replay"
test = "job_scout.main:test"
run_with_trigger = "job_scout.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "16967b55-c928-47a9-8ca9-81ba20756371"
